name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Install AutoIt
        run: choco install autoit -y

      - name: Build exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $compilerCandidates = @(
            "C:\Program Files (x86)\AutoIt3\Aut2Exe\Aut2exe.exe",
            "C:\Program Files\AutoIt3\Aut2Exe\Aut2exe.exe"
          )
          $aut2exe = $compilerCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (!$aut2exe) {
            throw "Aut2Exe compiler was not found"
          }
          Write-Host "Using AutoIt compiler: $aut2exe"

          $input = Join-Path (Get-Location) "gui_dlpc.au3"
          $output = Join-Path (Get-Location) "dist\duel-links-bot.exe"
          $stdoutFile = Join-Path (Get-Location) "dist\aut2exe.stdout.log"
          $stderrFile = Join-Path (Get-Location) "dist\aut2exe.stderr.log"
          $arguments = @('/in', $input, '/out', $output, '/x86', '/nopack')
          $process = Start-Process -FilePath $aut2exe -ArgumentList $arguments -WorkingDirectory (Get-Location) -PassThru -NoNewWindow -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
          $deadline = [DateTime]::UtcNow.AddSeconds(120)
          while (!$process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force
            Get-Content -LiteralPath $stdoutFile -ErrorAction SilentlyContinue
            Get-Content -LiteralPath $stderrFile -ErrorAction SilentlyContinue
            throw "Aut2Exe timed out after 120 seconds"
          }
          Get-Content -LiteralPath $stdoutFile -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $stderrFile -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            throw "Aut2Exe failed with exit code $($process.ExitCode)"
          }
          if (!(Test-Path -LiteralPath $output)) {
            Get-ChildItem -LiteralPath (Join-Path (Get-Location) "dist") -Force
            throw "Aut2Exe completed but did not create $output"
          }
          Get-Item -LiteralPath $output

      - name: Package
        shell: pwsh
        run: |
          Copy-Item "FastFind.dll" "dist\"
          Copy-Item "FastFind64.dll" "dist\"
          Copy-Item "help.txt" "dist\"

          if (Test-Path "README.md") {
            Copy-Item "README.md" "dist\"
          }

          Compress-Archive -Path "dist\*" -DestinationPath "duel-links-bot-${{ github.ref_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: duel-links-bot-${{ github.ref_name }}
          path: duel-links-bot-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: duel-links-bot-${{ github.ref_name }}.zip
