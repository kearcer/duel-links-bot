name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Install AutoIt tools
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location) "autoit-setup.exe"
          Invoke-WebRequest -Uri "https://www.autoitscript.com/cgi-bin/getfile.pl?autoit3/autoit-v3-setup.exe" -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "AutoIt installer failed with exit code $($install.ExitCode)"
          }
          Remove-Item -LiteralPath $installer -Force

          $sciteInstaller = Join-Path (Get-Location) "scite-setup.exe"
          Invoke-WebRequest -Uri "https://www.autoitscript.com/cgi-bin/getfile.pl?../autoit3/scite/download/SciTE4AutoIt3.exe" -OutFile $sciteInstaller
          $sciteInstall = Start-Process -FilePath $sciteInstaller -ArgumentList "/S" -Wait -PassThru
          if ($sciteInstall.ExitCode -ne 0) {
            throw "SciTE4AutoIt3 installer failed with exit code $($sciteInstall.ExitCode)"
          }
          Start-Sleep -Seconds 5
          Remove-Item -LiteralPath $sciteInstaller -Force

      - name: Build exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $programFiles = ${env:ProgramFiles(x86)}
          $autoit = Join-Path $programFiles "AutoIt3\AutoIt3.exe"
          $wrapper = Join-Path $programFiles "AutoIt3\SciTE\AutoIt3Wrapper\AutoIt3Wrapper.au3"
          if (!(Test-Path -LiteralPath $autoit) -or !(Test-Path -LiteralPath $wrapper)) {
            throw "AutoIt3 or AutoIt3Wrapper was not found"
          }
          Write-Host "Using AutoIt3Wrapper: $wrapper"

          $inputName = "gui_dlpc.au3"
          $output = Join-Path (Get-Location) "dist\duel-links-bot.exe"
          Write-Host "Using AutoIt3Wrapper: $wrapper"
          Write-Host "Compiling $inputName from $(Get-Location)"

          $argumentLine = "`"$wrapper`" /NoStatus /prod /in $inputName"
          $process = Start-Process -FilePath $autoit -ArgumentList $argumentLine -WorkingDirectory (Get-Location) -PassThru -NoNewWindow
          if (!$process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw "AutoIt3Wrapper timed out after 120 seconds"
          }
          $process.Refresh()
          $exitCode = $process.ExitCode
          if ($null -ne $exitCode -and $exitCode -ne 0) {
          throw "AutoIt3Wrapper failed with exit code $exitCode"
          }

          $compiled = Join-Path (Get-Location) "gui_dlpc.exe"
          if (!(Test-Path -LiteralPath $compiled)) {
            Get-ChildItem -LiteralPath (Get-Location) -Filter "*.exe" -Force
            throw "AutoIt3Wrapper completed but did not create $compiled"
          }
          Move-Item -LiteralPath $compiled -Destination $output -Force
          Get-Item -LiteralPath $output
          if (!(Test-Path -LiteralPath $output)) {
            Get-ChildItem -LiteralPath (Join-Path (Get-Location) "dist") -Force
            throw "Aut2Exe completed but did not create $output"
          }
          Get-Item -LiteralPath $output

      - name: Package
        shell: pwsh
        run: |
          Copy-Item "FastFind.dll" "dist\"
          Copy-Item "FastFind64.dll" "dist\"
          Copy-Item "help.txt" "dist\"

          if (Test-Path "README.md") {
            Copy-Item "README.md" "dist\"
          }

          Compress-Archive -Path "dist\*" -DestinationPath "duel-links-bot-${{ github.ref_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: duel-links-bot-${{ github.ref_name }}
          path: duel-links-bot-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: duel-links-bot-${{ github.ref_name }}.zip
