name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run tests
        shell: pwsh
        run: ./tests/run-tests.ps1

      - name: Install AutoIt
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location) "autoit-setup.exe"
          Invoke-WebRequest -Uri "https://www.autoitscript.com/cgi-bin/getfile.pl?autoit3/autoit-v3-setup.exe" -OutFile $installer
          $install = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "AutoIt installer failed with exit code $($install.ExitCode)"
          }
          Start-Sleep -Seconds 5
          Remove-Item -LiteralPath $installer -Force

      - name: Build exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $autoit = Join-Path ${env:ProgramFiles(x86)} "AutoIt3\AutoIt3.exe"
          $wrapper = Join-Path ${env:ProgramFiles(x86)} "AutoIt3\SciTE\AutoIt3Wrapper\AutoIt3Wrapper.au3"
          if (!(Test-Path -LiteralPath $autoit) -or !(Test-Path -LiteralPath $wrapper)) {
            throw "AutoIt3 or AutoIt3Wrapper was not found"
          }
          Write-Host "Using AutoIt3Wrapper: $wrapper"

          $input = Join-Path (Get-Location) "gui_dlpc.au3"
          $output = Join-Path (Get-Location) "dist\duel-links-bot.exe"
          $arguments = @($wrapper, '/NoStatus', '/prod', '/in', $input, '/out', $output)
          $process = Start-Process -FilePath $autoit -ArgumentList $arguments -WorkingDirectory (Get-Location) -PassThru -NoNewWindow
          $deadline = [DateTime]::UtcNow.AddSeconds(120)
          while (!$process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (!$process.HasExited) {
            Stop-Process -Id $process.Id -Force
            throw "AutoIt3Wrapper timed out after 120 seconds"
          }
          if ($process.ExitCode -ne 0) {
            throw "AutoIt3Wrapper failed with exit code $($process.ExitCode)"
          }
          if (!(Test-Path -LiteralPath $output)) {
            Get-ChildItem -LiteralPath (Join-Path (Get-Location) "dist") -Force
            throw "Aut2Exe completed but did not create $output"
          }
          Get-Item -LiteralPath $output

      - name: Package
        shell: pwsh
        run: |
          Copy-Item "FastFind.dll" "dist\"
          Copy-Item "FastFind64.dll" "dist\"
          Copy-Item "help.txt" "dist\"

          if (Test-Path "README.md") {
            Copy-Item "README.md" "dist\"
          }

          Compress-Archive -Path "dist\*" -DestinationPath "duel-links-bot-${{ github.ref_name }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: duel-links-bot-${{ github.ref_name }}
          path: duel-links-bot-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: duel-links-bot-${{ github.ref_name }}.zip
