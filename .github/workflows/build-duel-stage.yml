name: Build Duel Stage Bot

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate entrypoint
        shell: pwsh
        run: |
          python -m py_compile tools\duel_stages.py tools\roi_manager.py tools\template_matcher.py tools\light_cyan_duelist_detector.py
          python tools\duel_stages.py --help

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean duel_stages.spec

      - name: Package
        shell: pwsh
        run: |
          $package = "duel-stage-bot-${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $package = "duel-stage-bot-pr-${{ github.event.pull_request.number }}"
          }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "dist\duel_stages.exe" $package -Force
          Copy-Item "run_duel_stage.bat" $package -Force
          Copy-Item "README.md" $package -Force
          Copy-Item "ROI_DB" $package -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath "$package.zip" -Force
          "PACKAGE_NAME=$package" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_NAME }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_NAME }}.zip